name: Build distilled core

on:
  workflow_dispatch:
  push:
    branches:
      - distilled-core

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_DISTILLED_CORE=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package build output
        if: success()
        run: |
          mkdir -p artifacts
          cp -a build/. artifacts/build/
          tar -C artifacts -czf distilled-core-build.tar.gz build

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: distilled-core-build
          path: artifacts/distilled-core-build.tar.gz
          if-no-files-found: error
          retention-days: 14
